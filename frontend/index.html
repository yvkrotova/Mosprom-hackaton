<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinQ Видеоконтроль</title>
  <meta name="description" content="Видеоконтроль промышленной безопасности на нейроускорителе LinQ" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232b67ff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E" />
  <script>
    // Свёрнутое меню — до первой отрисовки, чтобы не мигало. Тема одна — тёмная.
    (function () {
      var c = null;
      try { c = JSON.parse(localStorage.getItem("linq.sidebarCollapsed")); } catch (e) { /* нет */ }
      if (c) document.documentElement.classList.add("sidebar-collapsed");
    })();
  </script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="logo"><b>LinQ</b><span>Видеоконтроль</span></div>
        <button class="collapse-btn" id="collapse-btn" aria-label="Свернуть меню" title="Свернуть меню"><i data-icon="chevrons-left"></i></button>
      </div>
      <nav class="nav" aria-label="Разделы">
        <button class="nav-item" data-tab="live" title="Мониторинг"><i data-icon="monitor"></i><span class="label">Мониторинг</span></button>
        <button class="nav-item" data-tab="journal" title="Журнал событий"><i data-icon="journal"></i><span class="label">Журнал событий</span></button>
        <button class="nav-item" data-tab="zones" title="Камеры и зоны"><i data-icon="cone"></i><span class="label">Камеры и зоны</span></button>
        <button class="nav-item" data-tab="stats" title="Статистика"><i data-icon="chart"></i><span class="label">Статистика</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="side-btn" id="settings-btn" title="Настройки"><i data-icon="settings"></i><span class="label">Настройки</span></button>
        <div class="sound-row" title="Звук уведомлений о нарушениях">
          <span id="sound-icon"></span>
          <span class="switch-label label" id="sound-text">Звук включён</span>
          <label class="switch"><input type="checkbox" id="sound-toggle" aria-label="Звук уведомлений" /><span class="knob"></span></label>
        </div>
        <button class="user-btn" id="user-btn" title="Оператор смены">
          <span class="avatar" id="user-avatar">ОС</span>
          <span class="user-name label">Оператор смены</span>
          <i data-icon="chevron-right"></i>
        </button>
      </div>
    </aside>

    <main class="content" id="content">
      <section id="screen-live" class="screen"></section>
      <section id="screen-journal" class="screen" hidden></section>
      <section id="screen-zones" class="screen" hidden></section>
      <section id="screen-stats" class="screen" hidden></section>
    </main>
  </div>

  <div id="offline-banner" class="banner banner-offline" role="alert" hidden>
    <i data-icon="server-off"></i>
    <span><b>Нет связи с сервером.</b> Данные на экране могут быть устаревшими, новые нарушения не приходят. Переподключаемся…</span>
  </div>
  <div id="sound-unlock" class="banner banner-sound" hidden>
    <i data-icon="volume-x"></i>
    <span>Браузер заблокировал звук до первого действия на странице. Уведомления будут без звука.</span>
    <button class="btn btn-sm" id="sound-unlock-btn">Включить звук</button>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
